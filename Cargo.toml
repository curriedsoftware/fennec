[workspace]
resolver = "3"
members = ["crates/fennec-core", "crates/fennec-cli"]
# The firmware targets xtensa-esp32-espidf with the `esp` toolchain and is
# built from its own directory.
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev.package."*"]
opt-level = 3
